spring:
  application:
    name: netAnalyzer
  datasource:
    url: jdbc:sqlite:netanalyzer.db
    driver-class-name: org.sqlite.JDBC
    username: 
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.community.dialect.SQLiteDialect

capture:
  tshark:
    path: ./tshark-portable/App/Wireshark/tshark
  temp:
    dir: ./temp-captures
