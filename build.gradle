plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 've.student'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	implementation 'org.hibernate.orm:hibernate-community-dialects'
	
	// pcap4j dependencies for packet capture parsing
	implementation 'org.pcap4j:pcap4j-core:1.8.2'
	implementation 'org.pcap4j:pcap4j-packetfactory-static:1.8.2'
	
	// reporting dependencies
	implementation 'com.github.librepdf:openpdf:1.3.30'
	implementation 'com.opencsv:opencsv:5.7.1'

	implementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('unitTest', Test) {
	group = 'verification'
	description = 'Runs the unit tests.'
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	
	exclude '**/*FunctionalTest.class'
	exclude '**/*IntegrationTest.class'
	reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/unitTest")
	reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/unitTest")
}

tasks.register('functionalTest', Test) {
	group = 'verification'
	description = 'Runs the functional and integration tests.'
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	
	include '**/*FunctionalTest.class'
	include '**/*IntegrationTest.class'
	reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/functionalTest")
	reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/functionalTest")
}

tasks.named('test') {
	useJUnitPlatform() // Obligatorio para que Gradle reconozca y ejecute JUnit 5
	dependsOn unitTest, functionalTest
	exclude '**/*' // Avoid running tests twice
}

tasks.register('stopServer') {
	group = 'application'
	description = 'Stops any running server process on port 8585'
	doLast {
		def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
		if (isWindows) {
			try {
				def process = Runtime.getRuntime().exec("cmd /c netstat -ano")
				def reader = new BufferedReader(new InputStreamReader(process.getInputStream()))
				def line
				def pids = [] as Set
				while ((line = reader.readLine()) != null) {
					if (line.contains(":8585") && line.contains("LISTENING")) {
						def parts = line.trim().split("\\s+")
						if (parts.length >= 5) {
							def pid = parts[4]
							if (pid && pid.isInteger() && pid != "0") {
								pids.add(pid)
							}
						}
					}
				}
				reader.close()
				process.waitFor()
				
				pids.each { pid ->
					println "Stopping existing server process with PID: ${pid}"
					Runtime.getRuntime().exec("taskkill /F /PID ${pid}").waitFor()
				}
			} catch (Exception e) {
				println "No existing server process found or error stopping: ${e.getMessage()}"
			}
		} else {
			try {
				def process = Runtime.getRuntime().exec(new String[]{"sh", "-c", "lsof -t -i:8585"})
				def reader = new BufferedReader(new InputStreamReader(process.getInputStream()))
				def pid = reader.readLine()?.trim()
				reader.close()
				process.waitFor()
				if (pid) {
					println "Stopping existing server process with PID: ${pid}"
					Runtime.getRuntime().exec("kill -9 ${pid}").waitFor()
				}
			} catch (Exception e) {
				println "No existing server process found or error stopping: ${e.getMessage()}"
			}
		}
	}
}

tasks.named('bootRun') {
	dependsOn 'stopServer'
	args = ['--server.port=8585']
}

tasks.register('startServer') {
	group = 'application'
	description = 'Starts the web server and outputs to console'
	dependsOn 'bootRun'
}

tasks.register('npmBuild', Exec) {
	group = 'build'
	description = 'Compiles the frontend application using npm'
	workingDir 'frontend'
	
	def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
	if (isWindows) {
		commandLine 'cmd', '/c', 'npm run build'
	} else {
		commandLine 'npm', 'run', 'build'
	}
}

tasks.register('cleanStatic', Delete) {
	group = 'build'
	description = 'Cleans the Spring Boot static resources folder'
	delete layout.projectDirectory.dir("src/main/resources/static")
}

tasks.register('copyFrontend', Copy) {
	group = 'build'
	description = 'Copies the compiled frontend assets to Spring Boot static resources'
	dependsOn 'npmBuild', 'cleanStatic'
	
	from layout.projectDirectory.dir('frontend/dist')
	into layout.projectDirectory.dir("src/main/resources/static")
}


tasks.register('runFrontend', Exec) {
	group = 'application'
	description = 'Launches the Electron desktop application (requires backend running on port 8585)'
	workingDir 'frontend'
	
	def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
	if (isWindows) {
		commandLine 'cmd', '/c', 'npm run electron:dev'
	} else {
		commandLine 'npm', 'run', 'electron:dev'
	}
}

tasks.register('runBackend') {
	group = 'application'
	description = 'Alias for bootRun to start the backend on port 8585'
	dependsOn 'bootRun'
}

tasks.register('runApp') {
	group = 'application'
	description = 'Starts Spring Boot + Vite dev server in background, then launches Electron'

	// Capture at configuration time — compatible with Gradle configuration cache
	def rootDir  = layout.projectDirectory.asFile
	def frontDir = layout.projectDirectory.dir('frontend').asFile

	doLast {
		def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

		// 1. Kill any existing processes on port 8585 and 3000
		println ">>> Stopping any existing processes on ports 8585 and 3000..."
		if (isWindows) {
			try {
				def netstat = Runtime.getRuntime().exec("cmd /c netstat -ano")
				def reader = new BufferedReader(new InputStreamReader(netstat.getInputStream()))
				def pids = [] as Set
				def line
				while ((line = reader.readLine()) != null) {
					if ((line.contains(":8585") || line.contains(":3000")) && line.contains("LISTENING")) {
						def parts = line.trim().split("\\s+")
						def pid = parts[parts.length - 1] // The last part is always the PID
						if (pid != "0") {
							pids.add(pid)
						}
					}
				}
				reader.close(); netstat.waitFor()
				pids.each { pid -> 
					println "  Killing PID ${pid} listening on port 8585 or 3000..."
					Runtime.getRuntime().exec("cmd /c taskkill /F /T /PID ${pid}").waitFor() 
				}
			} catch (Exception e) { println "  Error killing processes: " + e.getMessage() }
		}

		// 2. Start Spring Boot backend in background
		println ">>> Starting Spring Boot backend on port 8585..."
		def backendCmd = isWindows
			? ["cmd", "/c", "start", "/B", "gradlew.bat", "bootRun", "--args=--server.port=8585"]
			: ["sh", "-c", "./gradlew bootRun --args='--server.port=8585' &"]
		new ProcessBuilder(backendCmd)
			.directory(rootDir)
			.inheritIO()
			.start()

		// 3. Start Vite dev server in background (port 3000)
		println ">>> Starting Vite dev server on port 3000..."
		def viteCmd = isWindows
			? ["cmd", "/c", "start", "/B", "npm", "run", "dev"]
			: ["sh", "-c", "npm run dev &"]
		new ProcessBuilder(viteCmd)
			.directory(frontDir)
			.inheritIO()
			.start()

		// 4. Launch Electron — main.cjs waits for both servers via waitForServer()
		println ">>> Launching Electron (will wait for both servers to be ready)..."
		def electronCmd = isWindows
			? ["cmd", "/c", "npm", "run", "electron:dev"]
			: ["npm", "run", "electron:dev"]
		new ProcessBuilder(electronCmd)
			.directory(frontDir)
			.inheritIO()
			.start()
			.waitFor()
	}
}
